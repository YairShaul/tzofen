<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>צופן נגד צופן</title>
<meta name="description" content="משחק ניחוש מספרים לשני שחקנים">
<meta name="theme-color" content="#18202E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="צופן">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen app — header (timer on the right), two guess logs side by side, entry slots + keypad pinned at the bottom */
:root {
  --bg: #E9EDF3;
  --surface: #F8FAFC;
  --ink: #18202E;
  --muted: #5B6678;
  --line: #CBD3DF;
  --p1: #D9482B;
  --p1-soft: #F8DDD6;
  --p2: #17847F;
  --p2-soft: #D3EEEC;
  --bull: #23955A;
  --cow: #D69412;
  --hint: #6B4FD8;
  --hint-soft: #E6E0FB;
  --key: #FFFFFF;
  --key-press: #DCE3EC;
  --shadow: 0 1px 0 rgba(24,32,46,.12), 0 2px 6px rgba(24,32,46,.06);
  --font-display: "Rubik", "Assistant", system-ui, sans-serif;
  --font-body: "Assistant", "Rubik", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121722; --surface: #1B2230; --ink: #E8ECF3; --muted: #97A2B5; --line: #2D3748;
    --p1: #FF7457; --p1-soft: #3A221E; --p2: #3CC2BA; --p2-soft: #15302F;
    --bull: #43C47E; --cow: #F2B53A; --hint: #A592FF; --hint-soft: #29234A;
    --key: #232C3C; --key-press: #2F3A4E;
    --shadow: 0 1px 0 rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121722; --surface: #1B2230; --ink: #E8ECF3; --muted: #97A2B5; --line: #2D3748;
  --p1: #FF7457; --p1-soft: #3A221E; --p2: #3CC2BA; --p2-soft: #15302F;
  --bull: #43C47E; --cow: #F2B53A; --hint: #A592FF; --hint-soft: #29234A;
  --key: #232C3C; --key-press: #2F3A4E;
  --shadow: 0 1px 0 rgba(0,0,0,.4); color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  -webkit-user-select: none; user-select: none;
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--p2); outline-offset: 2px; }
.num { direction: ltr; unicode-bidi: isolate; font-family: var(--font-display); font-variant-numeric: tabular-nums; }

#app {
  height: 100%; max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(12px, env(safe-area-inset-top, 0px));
  padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 12px;
}
input { -webkit-user-select: text; user-select: text; }
.link-btn { background: none; border: none; color: var(--p2); font-weight: 700; font-size: .85rem; padding: 2px 0; text-decoration: underline; }
.pin-input { font: 800 1.6rem var(--font-display) !important; letter-spacing: .4em; text-align: center; direction: ltr; padding: 10px !important; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; }
.install { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--hint-soft); color: var(--hint); border-radius: 12px; padding: 10px 14px; font-weight: 700; font-size: .9rem; }
.install button { background: var(--hint); color: #fff; border: none; border-radius: 99px; padding: 6px 14px; font: 700 .9rem var(--font-display); flex: none; }
.steps { margin: 0; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 6px; text-align: start; color: var(--ink); line-height: 1.5; }
.screen { flex: 1; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
.scroll { overflow-y: auto; }
.center { justify-content: center; }

h1, h2 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
h1 { font-size: 2.3rem; font-weight: 800; letter-spacing: -.01em; line-height: 1.05; }
h2 { font-size: 1.5rem; font-weight: 700; }
p { margin: 0; line-height: 1.5; color: var(--muted); }

.logo { display: flex; gap: 6px; direction: ltr; }
.logo span { width: 34px; height: 44px; border-radius: 8px; display: grid; place-items: center; font: 800 1.4rem var(--font-display); background: var(--surface); border: 2px solid var(--line); }
.logo span.b { background: var(--bull); border-color: var(--bull); color: #fff; }
.logo span.c { border-color: var(--cow); color: var(--cow); }

.panel { background: var(--surface); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.lock { font-size: .8rem; font-weight: 700; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .label { font-size: .8rem; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.field input[type=text] {
  font: 600 1.05rem var(--font-body); padding: 10px 12px; border-radius: 10px;
  border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); width: 100%;
}
.names { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.names .field:first-child input { border-color: var(--p1); }
.names .field:last-child input { border-color: var(--p2); }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; min-width: 0; padding: 9px 0; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); font: 700 1rem var(--font-display); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg button:disabled { cursor: default; }
.seg button:disabled:not([aria-pressed="true"]) { opacity: .45; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--p2); flex: none; }

.btn { padding: 14px 18px; border-radius: 12px; border: none; font: 700 1.1rem var(--font-display); background: var(--ink); color: var(--bg); }
.btn.p1 { background: var(--p1); color: #fff; }
.btn.p2 { background: var(--p2); color: #fff; }
.btn.ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--line); }
.btn:disabled { opacity: .4; cursor: default; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn small { display: block; font: 600 .8rem var(--font-body); opacity: .85; margin-top: 2px; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.rules { display: flex; flex-direction: column; gap: 8px; font-size: .95rem; }
.rules div { display: flex; align-items: center; gap: 10px; color: var(--muted); flex-wrap: wrap; }

.peg { display: inline-flex; align-items: center; gap: 4px; font: 700 1rem var(--font-display); }
.peg i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.peg.bull i { background: var(--bull); }
.peg.cow i { border: 2.5px solid var(--cow); }
.peg.zero { opacity: .35; }
.wait-dots { color: var(--muted); font-weight: 700; letter-spacing: .1em; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .3; } }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
.top-start { display: flex; align-items: center; gap: 10px; min-width: 0; }
.top-end { display: flex; align-items: center; gap: 10px; flex: none; }
.top .x { background: none; border: none; color: var(--muted); font-weight: 700; padding: 6px 4px; }
.turn-banner { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; min-width: 0; }
.turn-banner b { color: var(--pc); }
.code-chip { font-size: .8rem; color: var(--muted); font-weight: 700; white-space: nowrap; }
.code-chip .num { letter-spacing: .1em; color: var(--ink); }
.watch { font-size: .75rem; font-weight: 700; color: var(--bg); background: var(--muted); border-radius: 99px; padding: 3px 9px; white-space: nowrap; }

/* Turn timer */
.timer { position: relative; width: 44px; height: 44px; flex: none; display: grid; place-items: center; }
.timer svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.timer circle { fill: none; stroke-width: 3.5; }
.timer .trk { stroke: var(--line); }
.timer .arc { stroke: var(--pc); stroke-dasharray: 97.4; stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
.timer span { font: 800 1rem var(--font-display); font-variant-numeric: tabular-nums; }
.timer.low .arc { stroke: var(--p1); }
.timer.low span { color: var(--p1); animation: blink .5s infinite; }

/* Logs */
.boards { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.board { min-width: 0; display: flex; flex-direction: column; background: var(--surface); border-radius: 14px; border: 2px solid transparent; overflow: hidden; transition: border-color .2s, opacity .2s; }
.board.active { border-color: var(--pc); }
.board:not(.active) { opacity: .72; }
.board-head { padding: 8px 10px; background: var(--pc-soft); display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.board-head strong { font-family: var(--font-display); color: var(--pc); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.board-head span { font-size: .8rem; color: var(--muted); white-space: nowrap; }
.hint-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 6px 10px; background: var(--hint-soft); color: var(--hint); font-size: .8rem; font-weight: 700; }
.mini { display: inline-flex; gap: 3px; }
.mini i, .mini b { width: 20px; height: 24px; border-radius: 5px; display: grid; place-items: center; font-style: normal; font: 800 .95rem var(--font-display); }
.mini i { border: 1.5px dashed var(--hint); opacity: .5; }
.mini b { background: var(--hint); color: #fff; }
.log { flex: 1; overflow-y: auto; padding: 4px 8px 8px; display: flex; flex-direction: column; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 7px 2px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: none; }
.row .g { font-size: 1.15rem; font-weight: 700; letter-spacing: .12em; }
.row .skip { font-size: .85rem; font-weight: 700; color: var(--muted); }
.row .res { display: flex; gap: 8px; }
.row.new { animation: pop .35s ease-out; }
.empty { color: var(--muted); font-size: .85rem; padding: 14px 4px; text-align: center; }
@keyframes pop { from { background: var(--pc-soft); } to { background: transparent; } }

/* Hint button */
.hint-bar { display: flex; justify-content: center; min-height: 34px; align-items: center; }
.hint-btn { border: 1.5px solid var(--hint); color: var(--hint); background: var(--hint-soft); border-radius: 99px; padding: 6px 16px; font: 700 .95rem var(--font-display); }
.hint-btn:disabled { opacity: .45; }
.hint-note { font-size: .85rem; font-weight: 700; color: var(--muted); }

/* Entry */
.slots { display: flex; justify-content: center; gap: 8px; direction: ltr; }
.slot { width: 52px; height: 62px; border-radius: 12px; background: var(--surface); border: 2px solid var(--line); display: grid; place-items: center; font: 800 2rem var(--font-display); }
.slot.filled { border-color: var(--pc, var(--ink)); }
.slot.cursor { border-style: dashed; border-color: var(--pc, var(--ink)); }
.msg { min-height: 1.4em; text-align: center; font-weight: 600; color: var(--muted); }
.msg.err { color: var(--p1); }

.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; direction: ltr; }
.pad button { height: 54px; border-radius: 12px; border: none; background: var(--key); box-shadow: var(--shadow); font: 600 1.5rem var(--font-display); }
.pad button:active { background: var(--key-press); }
.pad button:disabled { opacity: .3; }
.pad .ok { background: var(--pc, var(--ink)); color: #fff; font-size: 1.1rem; }
.pad.off { opacity: .45; pointer-events: none; }
.pad button.marked { position: relative; color: var(--muted); background: var(--bg); box-shadow: inset 0 0 0 1.5px var(--line); }
.pad button.marked::after { content: ""; position: absolute; left: 28%; right: 28%; top: 50%; height: 3px; border-radius: 2px; background: var(--p1); transform: rotate(-35deg); }
.pad button.marked:disabled { opacity: .85; }
.pad.marking button[data-d] { box-shadow: inset 0 0 0 2px var(--p1); }
.pad.marking button.marked { background: var(--p1-soft); }

/* Tools row: mark digits + hint */
.tools { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 34px; }
.tools .hint-bar { min-height: 0; }
.mark-btn { border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 99px; padding: 6px 14px; font: 700 .9rem var(--font-display); white-space: nowrap; }
.mark-btn.on { background: var(--p1); border-color: var(--p1); color: #fff; }

/* Online: your own secret, so you can see how close the opponent is */
.mine-strip { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 12px; border-radius: 12px; background: var(--pc-soft); color: var(--pc); font-size: .85rem; font-weight: 700; }
.mine-strip .mini b { background: var(--pc); }

.pass { text-align: center; align-items: center; }
.pass .who { font: 800 2.4rem var(--font-display); color: var(--pc); }
.phone-icon { width: 64px; height: 100px; border: 4px solid var(--pc); border-radius: 14px; position: relative; animation: tilt 2.4s ease-in-out infinite; }
.phone-icon::after { content: ""; position: absolute; bottom: 8px; left: 50%; width: 14px; height: 4px; margin-left: -7px; border-radius: 2px; background: var(--pc); }
@keyframes tilt { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }

/* Online lobby */
.big-code { font: 800 3.4rem var(--font-display); letter-spacing: .25em; color: var(--pc); direction: ltr; text-align: center; }
.or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-weight: 700; font-size: .85rem; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.join-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.join-row input { font: 800 1.4rem var(--font-display) !important; letter-spacing: .3em; text-align: center; direction: ltr; }
.note { font-size: .85rem; color: var(--muted); line-height: 1.5; }
.spinner { width: 34px; height: 34px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--pc, var(--ink)); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.win { text-align: center; align-items: center; }
.win .who { font: 800 2.6rem var(--font-display); color: var(--pc); }
.reveal { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.reveal div { background: var(--surface); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.reveal .num { font-size: 1.6rem; font-weight: 800; letter-spacing: .15em; }
.actions { display: flex; flex-direction: column; gap: 10px; width: 100%; }

.sheet { position: fixed; inset: 0; background: rgba(10,14,22,.5); display: grid; place-items: center; padding: 16px; z-index: 20; }
.sheet .panel { max-width: 340px; width: 100%; text-align: center; }
.sheet .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* +/- steppers in settings */
.stepper-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.stepper { display: flex; align-items: center; gap: 4px; direction: ltr; flex: none; }
.stepper button { width: 40px; height: 40px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); font: 800 1.3rem var(--font-display); display: grid; place-items: center; }
.stepper button:disabled { opacity: .35; cursor: default; }
.stepper output { min-width: 72px; text-align: center; font: 700 1.05rem var(--font-display); direction: rtl; }

/* Tournament */
.tour-btn { background: var(--hint); color: #fff; }
.bracket { display: flex; flex-direction: column; gap: 10px; }
.match { background: var(--surface); border-radius: 12px; padding: 10px 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; }
.match.final { border: 2px solid var(--cow); }
.match .mt { font-size: .75rem; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.match .pl { display: flex; justify-content: space-between; align-items: center; font: 700 1.05rem var(--font-display); }
.match .pl.won { color: var(--bull); }
.match .pl.lost { color: var(--muted); text-decoration: line-through; }
.match .pl.tbd { color: var(--muted); font-weight: 500; }
.tnote { padding: 7px 12px; border-radius: 12px; background: var(--hint-soft); color: var(--hint); font-weight: 700; font-size: .9rem; text-align: center; }
.names4 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.eye { background: none; border: none; color: var(--muted); font-weight: 700; font-size: .9rem; align-self: center; padding: 6px 10px; }

@media (max-height: 680px) {
  .pad button { height: 46px; }
  .slot { height: 52px; width: 46px; font-size: 1.7rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div id="app" dir="rtl"></div>

<script>
(function () {
  const app = document.getElementById('app');

  /* ---------- Game options (only the owner can change them) ---------- */
  const OPTS = { n: [3, 4, 5, 6] };
  // +/- steppers: [min, max, step]
  const STEP = { timer: [0, 600, 5], hintAfter: [0, 50, 1], hintCount: [1, 5, 1] };
  const DEF = { n: 4, rep: false, timer: 0, hintAfter: 0, hintCount: 1 };
  const clampInt = (v, lo, hi, d) => Number.isInteger(v) ? Math.min(hi, Math.max(lo, v)) : d;
  const maxHints = n => n - 1;   // never reveal the whole number
  function cleanCfg(o) {
    o = o && typeof o === 'object' ? o : {};
    const n = OPTS.n.includes(o.n) ? o.n : DEF.n;
    const t = clampInt(o.timer, 0, STEP.timer[1], 0);
    return {
      n,
      rep: !!o.rep,
      timer: t - (t % 5),
      hintAfter: clampInt(o.hintAfter, 0, STEP.hintAfter[1], 0),
      hintCount: clampInt(o.hintCount, 1, maxHints(n), 1),
    };
  }
  function hintText(c) {
    if (!c.hintAfter) return 'בלי רמזים';
    if (c.hintCount === 1) return `רמז אחרי ${c.hintAfter} תורות`;
    return `${c.hintCount} רמזים, כל ${c.hintAfter} תורות`;
  }
  function hintScheduleText(c) {
    const at = Array.from({ length: c.hintCount }, (_, k) => c.hintAfter * (k + 1));
    return `כל שחקן יוכל לגלות ספרה אחרי ${at.join(', ')} תורות.`;
  }
  // Turns a player must have played before hint number k (0-based) opens
  const hintUnlockAt = (c, k) => c.hintAfter * (k + 1);
  function cfgText(c) {
    return [
      `${c.n} ספרות`,
      c.rep ? 'ספרות חוזרות מותרות' : 'בלי ספרות חוזרות',
      c.timer ? `${c.timer} שניות לתור` : 'בלי טיימר',
      hintText(c),
    ].join(' · ');
  }

  // Owner lock: settings open only with the owner's code. The code itself is not
  // stored here, only its SHA-256 fingerprint.
  const OWNER_HASH = 'e8d389b9847a1dc577208ccc55317d2d56c15d5d77930d0b4acbcdd52d4f70d1';
  const ls = {
    // ?dev=N gives a separate storage per tab/frame, to test several "phones" on one computer
    ns: (() => { try { const d = new URLSearchParams(location.search).get('dev'); return d ? `dev${d.replace(/\W/g, '').slice(0, 8)}:` : ''; } catch (e) { return ''; } })(),
    get(k) { try { return localStorage.getItem(this.ns + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(this.ns + k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(this.ns + k); } catch (e) {} },
  };
  let IS_OWNER = ls.get('cvc-owner') === OWNER_HASH;
  let CFG = cleanCfg(IS_OWNER ? (() => { try { return JSON.parse(ls.get('cvc-cfg')); } catch (e) { return null; } })() : DEF);
  const ownerKnown = true, cfgLoaded = true, savingCfg = false;
  let cfgErr = '';

  async function sha256(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }
  function saveCfg() { if (IS_OWNER) ls.set('cvc-cfg', JSON.stringify(CFG)); }
  // Opening a new game (one phone, online host, tournament) is for admins only
  function adminOnly(fn) { if (IS_OWNER) fn(); else askOwnerCode(fn); }

  function askOwnerCode(then) {
    const el = document.createElement('div');
    el.className = 'sheet'; el.dir = 'rtl';
    el.innerHTML = `<div class="panel"><h2>קוד מנהל</h2><p>רק מנהל יכול לפתוח משחק ולשנות את ההגדרות. אפשר להצטרף למשחק קיים עם קוד גם בלי זה.</p>
      <input id="pin" class="pin-input" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
      <div class="msg err" id="pinmsg"></div>
      <div class="row2"><button class="btn ghost" id="no">ביטול</button><button class="btn" id="yes">פתיחה</button></div></div>`;
    document.body.appendChild(el);
    const input = el.querySelector('#pin');
    setTimeout(() => input.focus(), 50);
    const tryIt = async () => {
      let h = '';
      try { h = await sha256('tzofen:' + input.value.trim()); } catch (e) {}
      if (h === OWNER_HASH) {
        ls.set('cvc-owner', OWNER_HASH); IS_OWNER = true;
        try { CFG = cleanCfg(JSON.parse(ls.get('cvc-cfg'))); } catch (e) {}
        el.remove();
        if (typeof then === 'function') then(); else render();
      } else { el.querySelector('#pinmsg').textContent = 'קוד שגוי'; input.value = ''; }
    };
    el.querySelector('#yes').onclick = tryIt;
    input.onkeydown = e => { if (e.key === 'Enter') tryIt(); };
    el.querySelector('#no').onclick = () => el.remove();
  }

  let S = loadLocal();      // per-device: names
  let MODE = 'home';        // home | local | lobby | online
  let G = null;             // one-phone game
  let O = null;             // online game
  let T = (() => { try { const t = JSON.parse(ls.get('cvc-tour')); return t && t.phase ? t : null; } catch (e) { return null; } })();   // one-phone tournament
  let entry = '';
  let reveal = true;   // while choosing a secret, the digits show unless the player hides them
  let message = { text: '', err: false };

  /* ---------- Direct phone-to-phone connection (PeerJS) ----------
     The phone that creates a game is the hub: everyone connects to it with the
     game code, sends it their own state, and it sends everyone's state back. */
  const PREFIX = 'tzofen-neged-tzofen-v1-';
  const RTC = { config: { iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'stun:global.stun.twilio.com:3478' },
  ] } };
  const roomKnown = true;
  let ROOM = { ok: () => typeof window.Peer === 'function' && navigator.onLine !== false };

  function openRoom(code, asHost) {
    return new Promise((resolve, reject) => {
      let mine = {}, closed = false, done = false, myId = null, hostConn = null, retryT = null;
      const handlers = [], states = new Map(), conns = new Map();
      let list = [];
      const clone = o => JSON.parse(JSON.stringify(o));
      const emitPeers = () => {
        const peers = asHost
          ? [{ peer: myId, sameTab: true, kind: 'viewer', presence: mine }, ...[...states].map(([peer, presence]) => ({ peer, sameTab: false, kind: 'viewer', presence }))]
          : list.map(x => ({ peer: x.peer, sameTab: x.peer === myId, kind: 'viewer', presence: x.presence }));
        handlers.forEach(h => { try { h({ peers }); } catch (e) { console.error(e); } });
      };
      const broadcast = () => {
        const payload = { t: 'peers', list: [{ peer: myId, presence: mine }, ...[...states].map(([peer, presence]) => ({ peer, presence }))] };
        conns.forEach(c => { if (c.open) { try { c.send(payload); } catch (e) {} } });
        emitPeers();
      };
      const room = {
        presence(patch) {
          mine = clone(Object.assign({}, mine, patch));
          if (asHost) broadcast();
          else if (hostConn && hostConn.open) { try { hostConn.send({ t: 'p', presence: mine }); } catch (e) {} }
          return Promise.resolve();
        },
        onPeers(h) { handlers.push(h); setTimeout(emitPeers, 0); return () => {}; },
        leave() { closed = true; clearTimeout(retryT); try { peer.destroy(); } catch (e) {} return Promise.resolve(); },
      };
      const finish = () => { if (!done) { done = true; resolve(room); } };
      const retry = () => {
        if (closed || retryT) return;
        retryT = setTimeout(() => { retryT = null; connectHost(); }, 3000);
      };
      function connectHost() {
        if (closed || !peer || peer.destroyed) return;
        if (peer.disconnected) { try { peer.reconnect(); } catch (e) {} return retry(); }
        let c;
        try { c = peer.connect(PREFIX + code, { reliable: true }); } catch (e) { return retry(); }
        let opened = false;
        const to = setTimeout(() => { if (!opened) { try { c.close(); } catch (e) {} retry(); } }, 10000);
        c.on('open', () => {
          opened = true; clearTimeout(to);
          hostConn = c;
          try { c.send({ t: 'p', presence: mine }); } catch (e) {}
        });
        c.on('data', d => {
          if (d && d.t === 'peers' && Array.isArray(d.list)) {
            list = d.list.filter(x => x && typeof x.peer === 'string' && x.presence && typeof x.presence === 'object').slice(0, 50);
            emitPeers();
          }
        });
        c.on('close', () => { clearTimeout(to); if (hostConn === c) { hostConn = null; list = []; emitPeers(); } retry(); });
        c.on('error', () => {});
      }

      const peer = asHost ? new Peer(PREFIX + code, RTC) : new Peer(RTC);
      peer.on('open', id => { myId = id; finish(); if (!asHost) connectHost(); else broadcast(); });
      peer.on('error', err => {
        const t = err && err.type;
        if (asHost && t === 'unavailable-id') { try { peer.destroy(); } catch (e) {} if (!done) return reject({ code: 'taken' }); return; }
        if (!asHost && t === 'peer-unavailable') { if (hostConn) { hostConn = null; list = []; emitPeers(); } return retry(); }
        if (!done && (t === 'network' || t === 'server-error' || t === 'socket-error' || t === 'socket-closed' || t === 'browser-incompatible')) {
          try { peer.destroy(); } catch (e) {}
          return reject({ code: t });
        }
      });
      peer.on('disconnected', () => { if (!closed) setTimeout(() => { if (!closed && !peer.destroyed) { try { peer.reconnect(); } catch (e) {} } }, 2000); });
      if (asHost) {
        peer.on('connection', c => {
          c.on('open', () => { conns.set(c.peer, c); broadcast(); });
          c.on('data', d => {
            if (d && d.t === 'p' && d.presence && typeof d.presence === 'object' && JSON.stringify(d.presence).length < 8000) {
              states.set(c.peer, d.presence); broadcast();
            }
          });
          c.on('close', () => { conns.delete(c.peer); states.delete(c.peer); broadcast(); });
          c.on('error', () => {});
        });
      }
    });
  }
  let resumeOnReady = false;

  function loadLocal() {
    const d = { names: ['שחקן 1', 'שחקן 2'], myName: '' };
    try { const s = JSON.parse(ls.get('cvc-local')); if (s && Array.isArray(s.names)) return Object.assign(d, s); } catch (e) {}
    return d;
  }
  function saveLocal() { ls.set('cvc-local', JSON.stringify(S)); }

  function score(secret, guess) {
    let bulls = 0; const cs = {}, cg = {};
    for (let i = 0; i < secret.length; i++) {
      if (secret[i] === guess[i]) bulls++;
      cs[secret[i]] = (cs[secret[i]] || 0) + 1;
      cg[guess[i]] = (cg[guess[i]] || 0) + 1;
    }
    let common = 0;
    for (const k in cg) common += Math.min(cg[k], cs[k] || 0);
    return { bulls, cows: common - bulls };
  }

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pc = i => `--pc: var(--p${i + 1}); --pc-soft: var(--p${i + 1}-soft);`;
  const lname = i => esc((G && Array.isArray(G.names) ? G.names[i] : S.names[i]) || `שחקן ${i + 1}`);
  const pegs = (b, c) => `<span class="peg bull ${b ? '' : 'zero'}" title="במקום"><i></i>${b}</span><span class="peg cow ${c ? '' : 'zero'}" title="לא במקום"><i></i>${c}</span>`;

  /* ---------- Turn timer ---------- */
  let TIMER = null, timerUsed = false;
  function setTimer(key, total, onExpire) {
    if (!total) return;
    timerUsed = true;
    if (!TIMER || TIMER.key !== key) {
      // Keep counting from when the turn really started, even if the app was closed in between
      let start = Date.now();
      try { const t = JSON.parse(ls.get('cvc-timer')); if (t && t.key === key && t.start <= start) start = t.start; } catch (e) {}
      TIMER = { key, total, start, onExpire, fired: false };
      ls.set('cvc-timer', JSON.stringify({ key, start }));
    } else TIMER.onExpire = onExpire;
  }
  const timerHTML = total => total ? `<div class="timer" id="timer" role="timer" aria-label="זמן שנותר לתור"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.5" class="trk"/><circle cx="18" cy="18" r="15.5" class="arc" id="tarc"/></svg><span id="tsec">${total}</span></div>` : '';
  function tick() {
    if (!TIMER) return;
    const left = Math.max(0, TIMER.total - (Date.now() - TIMER.start) / 1000);
    const s = document.getElementById('tsec'), a = document.getElementById('tarc'), t = document.getElementById('timer');
    if (s) s.textContent = Math.ceil(left);
    if (a) a.style.strokeDashoffset = (97.4 * (1 - left / TIMER.total)).toFixed(1);
    if (t) t.classList.toggle('low', left <= 5);
    if (left <= 0 && !TIMER.fired) { TIMER.fired = true; if (TIMER.onExpire) TIMER.onExpire(); }
  }
  setInterval(tick, 250);

  /* ---------- Keypad ---------- */
  let padKey = null;
  function slotsHTML(n, masked) {
    return `<div class="slots" aria-live="polite">${Array.from({ length: n }, (_, k) => {
      const ch = entry[k];
      const shown = ch === undefined ? '' : (masked ? '•' : ch);
      return `<div class="slot ${ch !== undefined ? 'filled' : ''} ${k === entry.length ? 'cursor' : ''}">${shown}</div>`;
    }).join('')}</div>`;
  }
  // Marking mode: the player crosses out digits they are sure the opponent doesn't have.
  // Crossed-out digits can't be typed until they are un-marked.
  let markMode = false;
  function padHTML(n, repeats, okLabel, enabled, marks) {
    const marking = markMode && !!marks;
    const isM = d => !!marks && marks.includes(String(d));
    const dis = d => marking ? '' : ((entry.length >= n || (!repeats && entry.includes(String(d))) || isM(d)) ? 'disabled' : '');
    const key = d => `<button data-d="${d}" class="${isM(d) ? 'marked' : ''}" ${dis(d)} ${isM(d) ? 'aria-label="ספרה ' + d + ' מסומנת"' : ''}>${d}</button>`;
    const msg = marking ? { text: 'לחצו על ספרה כדי לסמן שהיא לא אצל היריב, או כדי לבטל', err: false } : message;
    return `<div class="msg ${msg.err ? 'err' : ''}">${msg.text}</div>
      <div class="pad ${marking ? 'marking' : (enabled ? '' : 'off')}">
        ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(key).join('')}
        <button data-k="back" aria-label="מחק" ${marking ? 'disabled' : ''}>⌫</button>
        ${key(0)}
        <button data-k="ok" class="ok" ${entry.length === n && !marking ? '' : 'disabled'}>${okLabel}</button>
      </div>`;
  }
  function toolsHTML(hintBar) {
    return `<div class="tools">
      <button class="mark-btn ${markMode ? 'on' : ''}" id="markbtn" aria-pressed="${markMode}">${markMode ? '✓ סיום סימון' : '✕ סימון ספרות'}</button>
      ${hintBar || '<span></span>'}
    </div>`;
  }
  function bindPad(n, repeats, onOk, enabled, marks, onMarks) {
    const canMark = !!marks;
    padKey = (enabled || (markMode && canMark)) ? k => {
      if (markMode && canMark) {
        if (/^\d$/.test(k)) {
          const i = marks.indexOf(k);
          if (i >= 0) marks.splice(i, 1); else marks.push(k);
          if (onMarks) onMarks();
          render();
        }
        return;
      }
      if (k === 'ok') { if (entry.length === n) onOk(); return; }
      message = { text: '', err: false };
      if (k === 'back') entry = entry.slice(0, -1);
      else if (entry.length < n && (repeats || !entry.includes(k)) && !(marks && marks.includes(k))) entry += k;
      render();
    } : null;
    app.querySelectorAll('.pad button').forEach(b => b.onclick = () => padKey && padKey(b.dataset.d !== undefined ? b.dataset.d : b.dataset.k));
    const mb = app.querySelector('#markbtn');
    if (mb) mb.onclick = () => { markMode = !markMode; render(); };
  }
  document.addEventListener('keydown', e => {
    if (!padKey || document.querySelector('.sheet') || e.target.tagName === 'INPUT') return;
    if (/^[0-9]$/.test(e.key)) padKey(e.key);
    else if (e.key === 'Backspace') padKey('back');
    else if (e.key === 'Enter') padKey('ok');
  });

  /* ---------- Shared pieces ---------- */
  function boardHTML(p, label, rows, active, fresh, hint, n) {
    const body = rows.length
      ? rows.map((r, k) => `<div class="row ${k === rows.length - 1 && fresh ? 'new' : ''}">${r.skip
          ? `<span class="skip">⏱ נגמר הזמן</span>`
          : `<span class="g num">${esc(r.g)}</span><span class="res">${r.b === undefined ? '<span class="wait-dots">•••</span>' : pegs(r.b, r.c)}</span>`}</div>`).join('')
      : `<div class="empty">עוד אין ניחושים</div>`;
    const hs = Array.isArray(hint) ? hint : (hint ? [hint] : []);
    const at = i => hs.find(h => h.p === i);
    const hintRow = hs.length ? `<div class="hint-row"><span>💡 ${hs.length > 1 ? `${hs.length} רמזים` : 'רמז'}</span><span class="mini num">${Array.from({ length: n }, (_, i) => at(i) ? `<b>${esc(at(i).d)}</b>` : '<i></i>').join('')}</span></div>` : '';
    return `<section class="board ${active ? 'active' : ''}" style="${pc(p)}">
      <div class="board-head"><strong>${label}</strong><span>${rows.length} תורות</span></div>
      ${hintRow}
      <div class="log">${body}</div>
    </section>`;
  }
  // hints: the ones this player already opened. Hint k opens after hintAfter*(k+1) turns.
  function hintBarHTML(cfg, hints, done, pending, canUse) {
    const used = hints.length;
    if (!cfg.hintAfter || used >= cfg.hintCount) return '';
    const left1 = cfg.hintCount - used;
    let inner;
    if (pending) inner = `<span class="hint-note">💡 מגלה ספרה…</span>`;
    else {
      const left = hintUnlockAt(cfg, used) - done;
      inner = left > 0
        ? `<span class="hint-note">💡 רמז ${cfg.hintCount > 1 ? `${used + 1}/${cfg.hintCount} ` : ''}ייפתח ${left === 1 ? 'אחרי התור הבא' : `אחרי עוד ${left} תורות`}</span>`
        : `<button class="hint-btn" id="hint" ${canUse ? '' : 'disabled'}>💡 גלה ספרה${left1 > 1 ? ` (נשארו ${left1})` : ''}</button>`;
    }
    return `<div class="hint-bar">${inner}</div>`;
  }
  // Pick a position not revealed yet
  function newHint(secret, hints) {
    const free = [...secret].map((_, i) => i).filter(i => !hints.some(h => h.p === i));
    const p = free[Math.floor(Math.random() * free.length)];
    return { p, d: secret[p] };
  }
  const asHints = h => Array.isArray(h) ? h : (h ? [h] : []);
  function topHTML(timerTotal, title, end) {
    return `<div class="top"><div class="top-start">${timerHTML(timerTotal)}<span class="turn-banner">${title}</span></div><div class="top-end">${end || ''}</div></div>`;
  }
  function scrollLogs() { app.querySelectorAll('.log').forEach(l => l.scrollTop = l.scrollHeight); }
  function confirmQuit(onYes, text) {
    const el = document.createElement('div');
    el.className = 'sheet'; el.dir = 'rtl';
    el.innerHTML = `<div class="panel"><h2>לצאת מהמשחק?</h2><p>${text || 'המשחק הנוכחי יימחק.'}</p>
      <div class="row2"><button class="btn ghost" id="no">חזרה</button><button class="btn p1" id="yes">יציאה</button></div></div>`;
    document.body.appendChild(el);
    el.querySelector('#no').onclick = () => el.remove();
    el.querySelector('#yes').onclick = () => { el.remove(); onYes(); };
    el.onclick = e => { if (e.target === el) el.remove(); };
  }

  /* ---------- Router ---------- */
  function render() {
    padKey = null; timerUsed = false;
    route();
    if (!timerUsed) TIMER = null;
    // Remember a one-phone game so reopening the app returns to it
    if (MODE === 'local' && G) ls.set('cvc-game', JSON.stringify(G)); else ls.del('cvc-game');
    if (T) ls.set('cvc-tour', JSON.stringify(T)); else ls.del('cvc-tour');
    tick();
  }
  function route() {
    if (MODE === 'lobby') return renderLobby();
    if (MODE === 'online' && O) return renderOnline();
    if (MODE === 'tonline' && TO) return renderTOnline();
    if (MODE === 'tour' && T) return T.phase === 'setup' ? renderTourSetup() : renderBracket();
    if (MODE === 'local' && G) {
      if (G.phase === 'names') return renderLocalNames();
      if (G.phase === 'secret') return renderLocalEntry('secret');
      if (G.phase === 'pass') return renderPass();
      if (G.phase === 'play') return renderLocalEntry('play');
      if (G.phase === 'win') return renderLocalWin();
    }
    MODE = 'home';
    renderHome();
  }

  function renderHome() {
    app.style.cssText = '';
    const dis = IS_OWNER ? '' : 'disabled';
    const seg = (key, label, fmt) => `<div class="field"><span class="label">${label}</span><div class="seg" role="group" aria-label="${label}">
      ${OPTS[key].map(v => `<button type="button" data-k="${key}" data-v="${v}" aria-pressed="${CFG[key] === v}" ${dis}>${fmt(v)}</button>`).join('')}</div></div>`;
    const stepper = (key, label, fmt, hi) => {
      const [lo, max, st] = STEP[key], top = hi === undefined ? max : hi, v = CFG[key];
      return `<div class="stepper-row"><span>${label}</span><div class="stepper" role="group" aria-label="${label}">
        <button type="button" data-s="${key}" data-d="-${st}" aria-label="פחות" ${dis} ${v <= lo ? 'disabled' : ''}>−</button>
        <output>${fmt(v)}</output>
        <button type="button" data-s="${key}" data-d="${st}" aria-label="יותר" ${dis} ${v >= top ? 'disabled' : ''}>+</button></div></div>`;
    };
    const lockedNote = IS_OWNER ? '' : '<p class="note" style="text-align:center">🔒 רק מנהל יכול לפתוח משחק. לחברים: "כל אחד בטלפון שלו" ← הקלדת הקוד שקיבלתם.</p>';
    const lockText = IS_OWNER
      ? '<span>🔓 מצב מנהל</span> <button class="link-btn" id="lockbtn">נעילה</button>'
      : '<button class="link-btn" id="unlock">🔒 נעול · פתיחה עם קוד מנהל</button>';
    const installBar = isStandalone() ? '' : (installEvt
      ? `<div class="install"><span>📲 התקינו את המשחק כאפליקציה</span><button id="install">התקנה</button></div>`
      : `<div class="install"><span>📲 אפשר להתקין את המשחק במסך הבית</span><button id="howinstall">איך?</button></div>`);
    app.innerHTML = `
      <div class="screen scroll">
        <div class="logo" aria-hidden="true"><span class="b">5</span><span class="c">6</span><span>9</span><span class="b">1</span></div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <h1>צופן נגד צופן</h1>
          <p>כל שחקן בוחר מספר סודי. מנחשים לסירוגין, ומי שמפצח ראשון את המספר של השני – מנצח.</p>
        </div>
        ${installBar}
        <div class="modes">
          <button class="btn p1" id="local">${IS_OWNER ? '' : '🔒 '}טלפון אחד<small>מעבירים מיד ליד</small></button>
          <button class="btn p2" id="online">כל אחד בטלפון שלו<small>${IS_OWNER ? 'משחק אונליין עם קוד' : 'הצטרפות עם קוד'}</small></button>
        </div>
        <button class="btn tour-btn" id="tour">${IS_OWNER ? '' : '🔒 '}🏆 טורניר<small>4 שחקנים · אונליין או בטלפון אחד</small></button>
        ${lockedNote}
        <div class="panel">
          <div class="panel-head"><span class="label">הגדרות המשחק</span><span class="lock">${lockText}</span></div>
          ${seg('n', 'כמות ספרות', v => v)}
          <label class="toggle" for="rep"><span>לאפשר ספרות חוזרות (למשל 5515)</span><input id="rep" type="checkbox" ${CFG.rep ? 'checked' : ''} ${dis}></label>
          ${stepper('timer', 'זמן לכל תור', v => v ? `<span class="num">${v}</span> שנ׳` : 'ללא')}
          ${stepper('hintAfter', 'רמז (גילוי ספרה) כל … תורות', v => v ? `<span class="num">${v}</span>` : 'ללא')}
          ${CFG.hintAfter ? stepper('hintCount', 'כמה רמזים בסך הכל', v => `<span class="num">${v}</span>`, maxHints(CFG.n)) : ''}
          ${CFG.hintAfter ? `<p class="note">${esc(hintScheduleText(CFG))}</p>` : ''}
        </div>
        <div class="panel rules">
          <span class="label">איך קוראים את התשובה</span>
          <div><span class="peg bull"><i></i></span> ספרה נכונה במקום הנכון</div>
          <div><span class="peg cow"><i></i></span> ספרה נכונה אבל במקום אחר</div>
          <div>מספר סודי <span class="num" style="font-weight:700">5691</span>, ניחוש <span class="num" style="font-weight:700">2610</span> ← ${pegs(1, 1)}</div>
        </div>
      </div>`;
    if (IS_OWNER) {
      app.querySelectorAll('.seg button').forEach(b => b.onclick = () => { CFG[b.dataset.k] = +b.dataset.v; CFG = cleanCfg(CFG); saveCfg(); render(); });
      app.querySelectorAll('.stepper button').forEach(b => b.onclick = () => {
        const k = b.dataset.s;
        CFG[k] = CFG[k] + (+b.dataset.d);
        CFG = cleanCfg(CFG); saveCfg(); render();
      });
      app.querySelector('#rep').onchange = e => { CFG.rep = e.target.checked; saveCfg(); render(); };
      app.querySelector('#lockbtn').onclick = () => { IS_OWNER = false; ls.del('cvc-owner'); CFG = cleanCfg(DEF); render(); };
    } else {
      app.querySelector('#unlock').onclick = askOwnerCode;
    }
    const ib = app.querySelector('#install');
    if (ib) ib.onclick = async () => { const e = installEvt; installEvt = null; try { e.prompt(); await e.userChoice; } catch (x) {} render(); };
    const hb = app.querySelector('#howinstall');
    if (hb) hb.onclick = showInstallHelp;
    app.querySelector('#local').onclick = () => adminOnly(() => { MODE = 'local'; G = { phase: 'names' }; render(); });
    app.querySelector('#tour').onclick = () => adminOnly(() => { MODE = 'tour'; T = T || { phase: 'setup' }; render(); });
    app.querySelector('#online').onclick = () => { MODE = 'lobby'; message = { text: '', err: false }; render(); };
  }

  /* ---------- Install as an app ---------- */
  let installEvt = null;
  const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (MODE === 'home') render(); });
  window.addEventListener('appinstalled', () => { installEvt = null; if (MODE === 'home') render(); });
  function showInstallHelp() {
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const el = document.createElement('div');
    el.className = 'sheet'; el.dir = 'rtl';
    el.innerHTML = `<div class="panel"><h2>התקנה במסך הבית</h2>
      ${ios
        ? `<ol class="steps"><li>פתחו את המשחק ב-Safari.</li><li>לחצו על כפתור השיתוף ⬆️.</li><li>בחרו "הוסף למסך הבית" ואז "הוסף".</li></ol>`
        : `<ol class="steps"><li>פתחו את המשחק ב-Chrome.</li><li>לחצו על ⋮ בפינה העליונה.</li><li>בחרו "התקנת אפליקציה" או "הוספה למסך הבית".</li></ol>`}
      <button class="btn" id="ok">הבנתי</button></div>`;
    document.body.appendChild(el);
    el.querySelector('#ok').onclick = () => el.remove();
    el.onclick = e => { if (e.target === el) el.remove(); };
  }
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }

  /* ================= ONE PHONE ================= */
  function renderLocalNames() {
    app.style.cssText = '';
    app.innerHTML = `
      <div class="screen center">
        <h2>מי משחק?</h2>
        <div class="panel">
          <div class="names">
            <div class="field"><label for="n1">שחקן ראשון</label><input id="n1" type="text" maxlength="14" value="${esc(S.names[0])}"></div>
            <div class="field"><label for="n2">שחקן שני</label><input id="n2" type="text" maxlength="14" value="${esc(S.names[1])}"></div>
          </div>
          <p class="note">${cfgText(CFG)}</p>
        </div>
        <button class="btn" id="start">מתחילים</button>
        <button class="btn ghost" id="back">חזרה</button>
      </div>`;
    app.querySelector('#start').onclick = () => {
      S.names[0] = app.querySelector('#n1').value.trim().slice(0, 14) || 'שחקן 1';
      S.names[1] = app.querySelector('#n2').value.trim().slice(0, 14) || 'שחקן 2';
      saveLocal(); newLocalGame(0, cleanCfg(CFG));
    };
    app.querySelector('#back').onclick = () => { MODE = 'home'; G = null; render(); };
  }

  function newLocalGame(first, cfg, names, tour) {
    G = { id: Date.now(), phase: 'secret', cfg, who: first, names: (names || S.names).slice(0, 2), tour: tour === undefined ? null : tour, secrets: ['', ''], logs: [[], []], hints: [[], []], marks: [[], []], turn: first, first, winner: null, passNext: null };
    entry = ''; reveal = true; markMode = false; message = { text: '', err: false };
    render();
  }

  function renderPass() {
    const i = G.who;
    app.style.cssText = pc(i);
    app.innerHTML = `
      <div class="screen center pass">
        <div class="phone-icon" aria-hidden="true"></div>
        <p>העבירו את המכשיר אל</p>
        <div class="who">${lname(i)}</div>
        <p>${G.passNext === 'secret' ? 'עכשיו תורך לבחור מספר סודי. ודאו שאף אחד לא מציץ.' : 'כל המספרים נבחרו. אפשר להתחיל לנחש!'}</p>
        <button class="btn p${i + 1}" id="go" style="min-width:200px">המשך</button>
      </div>`;
    app.querySelector('#go').onclick = () => { G.phase = G.passNext; entry = ''; reveal = true; message = { text: '', err: false }; render(); };
  }

  function renderLocalEntry(mode) {
    const c = G.cfg;
    const i = mode === 'secret' ? G.who : G.turn;
    if (!Array.isArray(G.marks)) G.marks = [[], []];
    G.hints = (G.hints || [null, null]).map(asHints);
    G.cfg = cleanCfg(G.cfg);
    app.style.cssText = pc(i);
    const quit = `<button class="x" id="quit">יציאה</button>`;
    if (mode === 'secret') {
      app.innerHTML = `${topHTML(0, `<b>${lname(i)}</b>, בחר/י מספר סודי`, quit)}
        <div class="screen center" style="gap:10px">
          <p style="text-align:center">${c.n} ספרות${c.rep ? '' : ', בלי ספרה שחוזרת על עצמה'}. ${lname(1 - i)} ינסה/תנסה לנחש אותו.</p>
          <button class="eye" id="eye">${reveal ? 'הסתר מספר' : 'הצג מספר'}</button>
        </div>
        ${slotsHTML(c.n, !reveal)}${padHTML(c.n, c.rep, 'אישור', true)}`;
      bindPad(c.n, c.rep, submitLocalSecret, true);
      app.querySelector('#eye').onclick = () => { reveal = !reveal; render(); };
    } else {
      setTimer(`L${G.id}:${G.logs[0].length}:${G.logs[1].length}`, c.timer, localTimeout);
      const boards = [0, 1].map(p => boardHTML(p, lname(p), G.logs[p], G.turn === p, G.lastBy === p, G.hints[p], c.n)).join('');
      app.innerHTML = `${topHTML(c.timer, `התור של <b>${lname(i)}</b>`, quit)}
        <div class="boards">${boards}</div>
        ${toolsHTML(hintBarHTML(c, G.hints[i], G.logs[i].length, false, true))}
        ${slotsHTML(c.n, false)}${padHTML(c.n, c.rep, 'נחש', true, G.marks[i])}`;
      bindPad(c.n, c.rep, submitLocalGuess, true, G.marks[i]);
      const h = app.querySelector('#hint');
      if (h) h.onclick = () => {
        G.hints[i].push(newHint(G.secrets[1 - i], G.hints[i]));
        message = { text: `💡 ${lname(i)} גילה/תה ספרה אחת`, err: false };
        render();
      };
      scrollLogs();
    }
    const inTour = G.tour !== null && G.tour !== undefined && T;
    app.querySelector('#quit').onclick = () => confirmQuit(() => { G = null; MODE = inTour ? 'tour' : 'home'; render(); },
      inTour ? 'חוזרים לטבלת הטורניר. המשחק הזה יתחיל מההתחלה.' : undefined);
  }

  function submitLocalSecret() {
    G.secrets[G.who] = entry;
    if (G.who === G.first) { G.who = 1 - G.first; G.passNext = 'secret'; }
    else { G.who = G.turn; G.passNext = 'play'; }
    G.phase = 'pass';
    entry = '';
    render();
  }
  function submitLocalGuess() {
    const p = G.turn;
    const { bulls, cows } = score(G.secrets[1 - p], entry);
    G.logs[p].push({ g: entry, b: bulls, c: cows });
    G.lastBy = p;
    entry = '';
    if (bulls === G.cfg.n) { G.winner = p; G.phase = 'win'; return render(); }
    G.turn = 1 - p;
    message = { text: `${lname(p)}: ${bulls} במקום, ${cows} לא במקום`, err: false };
    render();
  }
  function localTimeout() {
    if (!G || G.phase !== 'play') return;
    const p = G.turn;
    G.logs[p].push({ skip: true });
    G.lastBy = p;
    G.turn = 1 - p;
    entry = '';
    message = { text: `⏱ נגמר הזמן ל${lname(p)}. התור עבר.`, err: true };
    render();
  }

  function renderLocalWin() {
    const w = G.winner;
    const inTour = Number.isInteger(G.tour) && !!T && T.phase === 'bracket';
    app.style.cssText = pc(w);
    app.innerHTML = `
      <div class="screen center win">
        <div class="logo" aria-hidden="true">${G.secrets[1 - w].split('').map(d => `<span class="b">${d}</span>`).join('')}</div>
        <p>פיצח/ה את הצופן!</p>
        <div class="who">${lname(w)}</div>
        <p>אחרי ${G.logs[w].length} תורות</p>

          ${[0, 1].map(i => `<div style="${pc(i)}"><span class="label" style="color:var(--pc)">המספר של ${lname(i)}</span><span class="num">${G.secrets[i]}</span></div>`).join('')}
        </div>
        <div class="actions">
          ${inTour ? `<button class="btn p${w + 1}" id="next">${G.tour === 2 ? '🏆 לטקס הזכייה' : 'המשך בטורניר'}</button>` : `
          <button class="btn p${w + 1}" id="again">משחק חוזר</button>
          <button class="btn ghost" id="home">למסך הראשי</button>`}
        </div>

    if (inTour) {
      app.querySelector('#next').onclick = () => {
        const m = T.m[G.tour];
        m.w = w === 0 ? m.a : m.b;
        if (G.tour < 2) { T.m[2][G.tour === 0 ? 'a' : 'b'] = m.w; }
        else T.phase = 'done';
        G = null; MODE = 'tour'; render();
      };

    }
    app.querySelector('#again').onclick = () => newLocalGame(1 - w, cleanCfg(CFG), G.names);   // loser starts
    app.querySelector('#home').onclick = () => { G = null; MODE = 'home'; render(); };
  }

  /* ================= TOURNAMENT (one phone, 4 players) ================= */
  // m[0], m[1] = semi-finals, m[2] = final. a/b are indexes into T.players, w the winner.
  function renderTourSetup() {
    app.style.cssText = pc(0);
    const prev = T.players || S.tourNames || ['', '', '', ''];
    app.innerHTML = `${topHTML(0, '🏆 טורניר', '<button class="x" id="back">חזרה</button>')}
      <div class="screen scroll">
        <p>4 שחקנים, נוקאאוט: שני חצאי גמר, והמנצחים נפגשים בגמר.</p>

          </div>
          <label class="toggle" for="shuf"><span>הגרלת זוגות לחצאי הגמר</span><input id="shuf" type="checkbox" checked></label>

      if (!ROOM.ok()) { const m = app.querySelector('#tmsg'); m.textContent = 'אין חיבור לאינטרנט'; m.className = 'msg err'; return; }

      if (new Set(names).size < 4) { const m = app.querySelector('#tmsg'); m.textContent = 'לכל שחקן צריך שם אחר'; m.className = 'msg err'; return; }
      S.tourNames = names; saveLocal();

      T = { phase: 'bracket', id: Date.now(), cfg: cleanCfg(CFG), players: order.map(i => names[i]),
        m: [{ a: 0, b: 1, w: null }, { a: 2, b: 3, w: null }, { a: null, b: null, w: null }] };

  function renderBracket() {
    const P = i => i === null ? null : esc(T.players[i]);
    const next = T.phase === 'done' ? -1 : T.m.findIndex(m => m.w === null);
    const titles = ['חצי גמר 1', 'חצי גמר 2', 'גמר'];
    const pl = (m, x) => {
      const i = m[x];
      if (i === null) return `<div class="pl tbd">${x === 'a' ? 'מנצח/ת חצי גמר 1' : 'מנצח/ת חצי גמר 2'}</div>`;
      const st = m.w === null ? '' : (m.w === i ? 'won' : 'lost');
      return `<div class="pl ${st}"><span>${P(i)}</span>${st === 'won' ? '<span>✓</span>' : ''}</div>`;
    };
    const card = (m, k) => `<div class="match ${k === 2 ? 'final' : ''}" ${k === next ? 'style="border:2px solid var(--p2)"' : ''}>
        <span class="mt">${titles[k]}${k === next ? ' · עכשיו' : ''}</span>${pl(m, 'a')}${pl(m, 'b')}</div>`;
    const champ = T.phase === 'done' ? T.m[2].w : null;

    app.innerHTML = `${topHTML(0, '🏆 טורניר', '<button class="x" id="quit">יציאה</button>')}
      <div class="screen scroll">

            <div style="font-size:3rem" aria-hidden="true">🏆</div><p>אלוף/ת הטורניר</p><div class="who" style="--pc:var(--cow)">${P(champ)}</div></div>` : ''}
        <div class="bracket">${T.m.map(card).join('')}</div>
        <p class="note" style="text-align:center">${cfgText(T.cfg)}</p>
        ${next >= 0 ? `<button class="btn p2" id="play">${next === 2 ? '🏆 לגמר' : 'למשחק'}: ${P(T.m[next].a)} נגד ${P(T.m[next].b)}</button>`
                    : `<button class="btn" id="newt">טורניר חדש</button>`}
      </div>`;
    const pb = app.querySelector('#play');
    if (pb) pb.onclick = () => {
      const m = T.m[next];

    };
